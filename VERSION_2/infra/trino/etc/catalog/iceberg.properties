connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lakehouse
iceberg.jdbc-catalog.default-warehouse-dir=s3a://dota-lakehouse/warehouse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/dota
iceberg.jdbc-catalog.connection-user=${ENV:PG_USER}
iceberg.jdbc-catalog.connection-password=${ENV:PG_PASSWORD}

fs.s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
s3.path-style-access=true
