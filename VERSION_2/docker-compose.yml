name: dota-lakehouse

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-volumes: &airflow_volumes
  - ./infra/airflow/dags:/opt/airflow/dags
  - ./infra/airflow/logs:/opt/airflow/logs
  - ./infra/spark/jars:/opt/spark-jars
  - ./src:/opt/spark-apps
  - ./infra/spark/spark-defaults.conf:/home/airflow/.local/lib/python3.11/site-packages/pyspark/conf/spark-defaults.conf:ro
  - /var/run/docker.sock:/var/run/docker.sock
  - ./src:/opt/src
  - ivy_cache:/tmp/.ivy2

services:
  # ===========================================================================
  # OBJECT STORAGE (S3-compatible)
  # ===========================================================================
  rustfs:
    image: rustfs/rustfs:1.0.6
    container_name: dota-rustfs
    restart: unless-stopped
    profiles: [base]
    command: server /data --console-address ":9001"
    environment:
      RUSTFS_ROOT_USER: ${S3_ACCESS_KEY}
      RUSTFS_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs-init:
    image: rustfs/rc:v0.1.38
    restart: "no"
    container_name: dota-rustfs-init
    profiles: [base]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      rc alias set local http://rustfs:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY --bucket-lookup path &&
      rc mb local/dota-lakehouse || true
      "

  # ===========================================================================
  # POSTGRESQL (Metadata + Lakehouse catalog)
  # Ports NOT exposed — access via Docker network or SSH tunnel only
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    profiles: [base]
    container_name: dota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD}
      MARQUEZ_PASSWORD: ${PG_PASSWORD}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

    logging: *logging

  # ===========================================================================
  # MONGODB (Game events)
  # Ports NOT exposed — access via Docker network or SSH tunnel only
  # ===========================================================================
  mongo:
    image: mongo:4.4
    profiles: [base]
    container_name: dota-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    logging: *logging

  # ===========================================================================
  # AIRFLOW (Orchestration)
  # ===========================================================================
  airflow-init:
    build: &airflow_build
      context: ./infra/airflow
      dockerfile: Dockerfile
    image: dota-airflow:2.11.2
    profiles: [etl]
    container_name: dota-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER:-airflow}:${AIRFLOW_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET}
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
      PYSPARK_PYTHON: /usr/bin/python3.11
      PYSPARK_DRIVER_PYTHON: python3
    user: "${AIRFLOW_UID:-50000}:0"
    command: bash -c "airflow db migrate && (airflow users create -r Admin -u admin -p ${AIRFLOW_ADMIN_PASSWORD} -f Admin -l User -e admin@local || true)"
    volumes: *airflow_volumes
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  airflow-webserver:
    build: *airflow_build
    image: dota-airflow:2.11.2
    profiles: [etl]
    container_name: dota-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow_env
      AIRFLOW__WEBSERVER__WORKERS: 2
    user: "${AIRFLOW_UID:-50000}:0"
    command: airflow webserver --port 8080
    ports:
      - "127.0.0.1:8081:8080"
    volumes: *airflow_volumes
    deploy:
      resources:
        limits:
          memory: 2G
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 600s

  airflow-scheduler:
    build: *airflow_build
    image: dota-airflow:2.11.2
    profiles: [etl]
    container_name: dota-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: 
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PYTHONPATH: /opt:/opt/spark-apps:/opt/spark-apps/common
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      <<: *airflow_env
    group_add: ["999"]
    user: "${AIRFLOW_UID:-50000}:0"
    command: airflow scheduler
    volumes: *airflow_volumes
    deploy:
      resources:
        limits:
          memory: 2G
    logging: *logging

  # ===========================================================================
  # SPARK CLUSTER (Master + Worker)
  # ===========================================================================
  spark-master:
    build:
      context: ./infra/spark
      dockerfile: Dockerfile
    image: dota-spark:3.5.8
    profiles: [etl]
    container_name: dota-spark-master
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8082
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8082:8082"
    volumes:
      - ./src:/opt/spark-apps
      - ./infra/spark/jars:/opt/spark-jars
      - ./infra/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/opt/src
      - ivy_cache:/tmp/.ivy2
    environment:
      PYTHONPATH: /opt:/opt/spark-apps:/opt/spark-apps/common
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      PYSPARK_PYTHON: /usr/bin/python3.11
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://spark-master:8082/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  spark-worker:
    build:
      context: ./infra/spark
      dockerfile: Dockerfile
    image: dota-spark:3.5.8
    profiles: [etl]
    container_name: dota-spark-worker
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8083
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./src:/opt/spark-apps
      - ./src:/opt/src
      - ./infra/spark/jars:/opt/spark-jars
      - ./infra/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy_cache:/tmp/.ivy2
    environment:
      PYTHONPATH: /opt:/opt/spark-apps:/opt/spark-apps/common
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_CORES: 1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      PYSPARK_PYTHON: /usr/bin/python3.11
    deploy:
      resources:
        limits:
          memory: 4G
    logging: *logging

  # ===========================================================================
  # TRINO (SQL query engine)
  # ===========================================================================
  trino:
    image: trinodb/trino:484
    profiles: [compute]
    container_name: dota-trino
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/trino/etc:/etc/trino
    deploy:
      resources:
        limits:
          memory: 1536M

  # ===========================================================================
  # SUPERSET (BI & Visualization)
  # ===========================================================================
  superset:
    build:
      context: ./infra/superset
      dockerfile: Dockerfile
    image: dota-superset:6.1.0
    profiles: [bi]
    container_name: dota-superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      PG_USER: ${PG_USER:-dota}
      PG_PASSWORD: ${PG_PASSWORD}
      SUPERSET_DB: ${SUPERSET_DB:-superset}
    command: >
      bash -c "
        (superset db upgrade && superset fab create-admin --username admin --firstname Admin --lastname User --email admin@local --password ${SUPERSET_ADMIN_PASSWORD} || true) &&
        superset init &&
        (/app/.venv/bin/python /app/infra/superset/init_superset.py &) &&
        superset run -h 0.0.0.0 -p 8088"
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./infra/superset/superset_config.py:/app/superset_config.py:ro
      - ./infra/superset/init_superset.py:/app/infra/superset/init_superset.py:ro
      - superset_data:/app/superset_home
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    logging: *logging

  # ===========================================================================
  # MARQUEZ (Data Lineage — OpenLineage)
  # ===========================================================================
  marquez:
    image: marquezproject/marquez:0.51.1
    container_name: dota-marquez
    profiles: [lineage]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: ${MARQUEZ_PORT:-5000}
      MARQUEZ_ADMIN_PORT: ${MARQUEZ_ADMIN_PORT:-5001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${PG_PORT:-5432}
      POSTGRES_DB: ${PG_DB}
      MARQUEZ_CONFIG: /usr/src/app/marquez.yml
      MARQUEZ_DB_HOST: ${MARQUEZ_DB_HOST:-localhost}
      MARQUEZ_DB_PORT: ${MARQUEZ_DB_PORT:-5432}
      MARQUEZ_DB_NAME: ${MARQUEZ_DB_NAME:-marquez}
      MARQUEZ_DB_USER: ${MARQUEZ_DB_USER:-marquez}
      MARQUEZ_DB_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5001:5001"
    volumes:
      - ./infra/marquez/marquez.yml:/usr/src/app/marquez.yml:ro
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    logging: *logging

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    container_name: dota-marquez-web
    profiles: [lineage]
    restart: unless-stopped
    depends_on:
      marquez:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${PG_PORT:-5432}
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      MARQUEZ_CONFIG: /usr/src/app/marquez.yml
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
      MARQUEZ_NAME: ${MARQUEZ_DB_NAME:-marquez}
      MARQUEZ_USER: ${MARQUEZ_DB_USER:-marquez}
      MARQUEZ_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    logging: *logging

  jupyter:
    image: quay.io/jupyter/pyspark-notebook:python-3.11
    profiles: [etl]
    container_name: dota-jupyter
    restart: unless-stopped
    command: start-notebook.sh --NotebookApp.token=''
    ports:
      - "127.0.0.1:8888:8888"
    env_file:
    - .env
    environment:
      - PYTHONPATH=/home/jovyan/work
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY}
      - AWS_REGION=us-east-1
      - PYSPARK_PYTHON=/opt/conda/bin/python
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./src:/home/jovyan/work/src
      - ./requirements.txt:/home/jovyan/work/requirements.txt
      - ./infra/spark/jars:/opt/spark-jars
      - ./infra/spark/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
      - ivy_cache:/tmp/.ivy2

  generator:
    image: ghcr.io/norvegianforestcat/data-gen-bootcamp2026:latest
    profiles: [base]
    container_name: dota-generator
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment:
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-dota}
      PG_USER: ${PG_USER:-dota}
      PG_PASSWORD: ${PG_PASSWORD}
      MONGO_HOST: ${MONGO_HOST:-mongo}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_DB: ${MONGO_DB:-dota_events}
      MONGO_USER: ${MONGO_USER:-dota}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      POSTGRES_URL: postgresql://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DB}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?authSource=admin
      MATCHES: ${MATCHES:-1000}
      SEED: ${SEED:-42}
    restart: "no"
    mem_limit: 512m


# ===========================================================================
# NAMED VOLUMES — data persists across container restarts
# ===========================================================================
volumes:
  pg_data:
  mongo_data:
  rustfs_data:
  superset_data:
  ivy_cache: